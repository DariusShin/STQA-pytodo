[pytest]
testpaths = .
pythonpath = . ../..
python_files = test_*.py
addopts = -ra --strict-markers -p no:cacheprovider
norecursedirs = .venv evidences __pycache__
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_file_date_format = %H:%M:%S
junit_family = xunit2
markers =
    auto(id): automated test case ID (TC-AUT-nnn) defined in README Task 3
    manual(*ids): manual test case(s) this check automates (TC-BB-nnn / TC-GUI-nnn)
    req(*ids): requirement(s) covered (REQ-nnn)
    known_defect(id): check is expected to fail until the named defect is fixed (run as strict xfail)
    smoke: critical-path subset, run on every change (11 checks)
    regression: full focused regression suite (applied to every test automatically)
    unit: browser-free rule checks against helpers.py
