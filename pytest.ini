[pytest]
testpaths = test/02_White_Box_Coverage
pythonpath = .
required_plugins = pytest-cov
addopts = -ra --strict-markers --cov=helpers --cov=app --cov-report=term-missing --cov-report=html:test/02_White_Box_Coverage/htmlcov
norecursedirs = .git .venv venv htmlcov
markers =
    unit: isolated tests of individual functions and decorators
    integration: tests using SQLite or Flask HTTP request handling
